# WAC configuration — read from wac.yml, next to WAC.exe.
# The command line overrides it. An unknown key or value refuses the collection.

# The version of WAC this file was written for (--write-config). A file of
# another version is refused: it may lack settings added since, or carry
# some that are gone. Write it again with --write-config.
wac_version: 4.0.0


# Executables: none; unverified (collect those whose signature does not hold);
# all (collect every one, its signature verdict recorded).
binary: unverified

# Threads analysing the executables; 0: the processor's threads minus one.
threads: 0

# Output folder, in the current directory.
output: output

# Detail of WAC.log: 0 (no log) to 3.
log_level: 0

# Raw hexadecimal values of shellbags and shortcuts, in the JSON.
dump: false

# Language of the console: fr or en. The JSON files and the logs stay in English.
language: fr

# The artefacts to collect, one key each; a missing key is true. The hives,
# event logs and $MFT are dependencies, copied when an artefact asked for reads them.
artefacts:
  dns_server:              true   # the DNS Server role: settings (ServerLevelPluginDll included), zones, records of the zone files, debug log
  dhcp_server:             true   # the DHCP Server role: settings (CalloutDlls included), scopes, leases of dhcp.mdb, audit logs
  hyperv:                  true   # the Hyper-V role: each virtual machine's configuration and its disks' paths; disks, memory and state not taken
  user_access_log:         true   # User Access Logging of a server (LogFiles\Sum): who reached each role, from which address, day by day
  application_registry:           # remote and archive tools in each user's registry; a value named like a password is not written
    putty:                 true   # PuTTY: sessions, SSH host keys
    seven_zip:             true   # 7-Zip: folders and archives used
    winrar:                true   # WinRAR: archive history
    winscp:                true   # WinSCP: sessions, SSH host keys, history
  # Applications' traces: one section per group, one switch per product, copied raw.
  # A group set to false (antivirus: false) switches off all its products; a missing product is on.
  antivirus:                      # logs and quarantine lists of antivirus other than Microsoft Defender
    avast:                 true   # Avast
    avg:                   true   # AVG
    avira:                 true   # Avira
    bitdefender:           true   # Bitdefender
    cybereason:            true   # Cybereason
    emsisoft:              true   # Emsisoft
    eset:                  true   # ESET
    fsecure:               true   # F-Secure
    hitmanpro:             true   # HitmanPro
    malwarebytes:          true   # Malwarebytes
    mcafee:                true   # McAfee
    roguekiller:           true   # RogueKiller
    secureage:             true   # SecureAge
    sentinelone:           true   # SentinelOne
    sophos:                true   # Sophos
    superantispyware:      true   # SUPERAntiSpyware
    symantec:              true   # Symantec Endpoint Protection
    totalav:               true   # TotalAV
    trend_micro:           true   # Trend Micro
    vipre:                 true   # VIPRE
    webroot:               true   # Webroot
  cloud_storage:                  # metadata of online storage clients: synchronised files, accounts
    box:                   true   # Box
    dropbox:               true   # Dropbox
    google_drive:          true   # Google Drive
    pcloud:                true   # pCloud
    sugarsync:             true   # SugarSync
  file_transfer:                  # file transfer tools: sites, transfer queues and logs
    filezilla_client:      true   # FileZilla
    freefilesync:          true   # FreeFileSync
    teracopy:              true   # TeraCopy
    winscp:                true   # WinSCP
  messaging:                      # messaging clients: local databases, sessions, logs
    discord:               true   # Discord
    jabber:                true   # Cisco Jabber
    mattermost:            true   # Mattermost
    signal:                true   # Signal
    skype:                 true   # Skype
    slack:                 true   # Slack
    teams:                 true   # Microsoft Teams
    telegram:              true   # Telegram
    viber:                 true   # Viber
    whatsapp:              true   # WhatsApp
    zoom:                  true   # Zoom
  remote_administration:          # remote administration tools: connection logs, configuration
    ammyy:                 true   # Ammyy Admin
    anydesk:               true   # AnyDesk
    atera:                 true   # Atera Agent
    kaseya:                true   # Kaseya
    logmein:               true   # LogMeIn
    radmin:                true   # Radmin
    remote_utilities:      true   # Remote Utilities
    rustdesk:              true   # RustDesk
    screenconnect:         true   # ScreenConnect
    splashtop:             true   # Splashtop
    supremo:               true   # Supremo
    teamviewer:            true   # TeamViewer
    ultraviewer:           true   # UltraViewer
    vnc:                   true   # VNC
    mremoteng:             true   # mRemoteNG
  server_applications:            # server applications: logs and configuration
    confluence:            true   # Confluence
    exchange:              true   # Exchange Server
    filezilla_server:      true   # FileZilla Server
    manageengine:          true   # ManageEngine
    sql_server:            true   # SQL Server
  server_logs:                    # logs Windows keeps on a server beyond the event logs
    certificate_authority: true   # Certification authority
    dcpromo:               true   # Domain controller promotion
    netlogon:              true   # Netlogon
    netsetup:              true   # Domain join
    nps:                   true   # Network Policy Server
    remote_access:         true   # Routing and Remote Access
  ssh:                            # OpenSSH: server configuration and logs, known hosts; private keys never taken
    openssh_server:        true   # OpenSSH server
    openssh_client:        true   # OpenSSH client
  system_traces:                  # what Windows keeps beyond the artefacts above
    crash_dumps:           true   # Crash dumps of the programs
    custom_shims:          true   # Custom application shims
    encapsulation_logging: true   # Encapsulation logging
    event_transcript:      true   # Diagnostic data store
    microsoft_sccm:        true   # Configuration Manager client
    minidumps:             true   # Kernel crash dumps
    notifications:         true   # Windows notifications
    office_cache:          true   # Office document cache
    pca:                   true   # Program Compatibility Assistant
    pcw_diagnostics:       true   # Program compatibility diagnostics
    power_diagnostics:     true   # Power efficiency diagnostics
    powershell_transcripts: true   # PowerShell transcripts
    scheduled_task_log:    true   # Task Scheduler's log
    search_gather_logs:    true   # Windows Search's gathering logs
    sleep_study:           true   # Sleep study
    snip_sketch:           true   # Snipping tool's screenshots
    startup_info:          true   # Startup information
    sticky_notes:          true   # Sticky Notes
    syscache:              true   # Syscache
    windows_old:           true   # The previous Windows
    windows_upgrade:       true   # Windows setup and upgrade logs
  virtualisation:                 # VirtualBox, VMware Workstation, WSL: machines and logs; disks not taken
    virtualbox:            true   # VirtualBox
    vmware:                true   # VMware Workstation
    wsl:                   true   # Windows Subsystem for Linux
  vpn:                            # VPN clients: configuration and logs
    openvpn:               true   # OpenVPN
    protonvpn:             true   # Proton VPN
    tailscale:             true   # Tailscale
    wireguard:             true   # WireGuard
  active_directory:        true   # a domain controller: ntds.dit raw with its logs; objects, memberships, replication metadata, security descriptors; no secret is read
  activities_cache:        true   # Windows Timeline: applications, files, pages, clipboard (ActivitiesCache.db)
  amcache:                 true   # Amcache.hve: applications, executables and drivers seen
  bam:                     true   # last execution of each program per user (Background Activity Moderator)
  bits:                    true   # qmgr.db: BITS jobs — URLs, destinations, notification command lines
  boot_records:            true   # what runs before Windows: each disk's first MiB (MBR, GPT), each partition's boot sectors, the EFI system partition's files
  cloud_identity:          true   # Entra ID join of the machine and work accounts of its users; token caches copied still encrypted
  defender:                true   # Microsoft Defender: support logs (MPLog, raw WPP traces), detection history, quarantine (copied encrypted)
  defender_configuration:  true   # Microsoft Defender exclusions and protection settings, its own and by policy
  defender_endpoint:       true   # Defender for Endpoint's local folder, where it is onboarded (Live Response outputs, cyber data), raw copy only
  deleted_files:                  # deleted files whose content the raw reading still finds: copied, with fingerprints (deleted_files.json)
    enabled:               true   # false: nothing read
    level:                 2      # 1: the content of the $MFT's deleted records; 2: and the names left in the directory indexes;
                                  # 3: and the files carved from the free clusters (PE, ZIP, PDF) — the whole free space read, however long
    max_file_mib:          64     # a larger file: listed with its fingerprints, not copied; unlimited: no bound (a carved file
                                  # is checked in memory: up to 4 GiB, 1 GiB by WAC32, beyond it listed or not found)
    max_total_mib:         4096   # all recovered contents copied, at most; the most recent first; unlimited: no bound
    excluded_folders:             # never read, on every volume: what the system deletes by the thousand
      - \Windows\WinSxS
      - \Windows\SoftwareDistribution
      - \Windows\servicing
      - \Windows\Installer\$PatchCache$
      - \Windows\System32\catroot
      - \Windows\System32\catroot2
      - \$Extend\$RmMetadata
  devices:                 true   # USB and SCSI devices with their dates, portable devices, volume labels per drive letter, device interfaces
  dpapi_master_keys:       true   # DPAPI master keys of each user and of the system, copied still encrypted; JSON: owner, GUID, dates, never the key
  emails:                  true   # Outlook (PST, OST) and Thunderbird (mbox): messages, recipients, times; bodies and attachments exported
  error_reports:           true   # Windows Error Reporting: programs that crashed, with their path
  etw_logs:                true   # ETW trace files Windows keeps on its disk (.etl: boot sessions, diagnostics, Windows Update), raw copy only
  event_log_configuration: true   # each event log and boot ETW session: enabled, size, retention, access (a disabled one is a trace)
  events:                  true   # the event logs, with their messages
  explorer_recent_docs:    true   # files each user opened, by extension, most recent first (Explorer's RecentDocs)
  fat_volumes:             true   # FAT and exFAT volumes, a suspect's USB keys included: every entry, deleted ones too
  firewall:                true   # firewall rules and profiles
  firewall_log:            true   # the firewall's log (pfirewall.log), when logging is on: connections allowed or dropped, addresses, ports, process
  group_policies:          true   # a domain controller: SYSVOL raw; the registry values, scripts, tasks and security templates of its policies
  hosts:                   true   # the hosts file: names diverted to an address
  installed_programs:      true   # installed programs (Uninstall) of the machine and of each user
  internet_settings:       true   # each user's proxy and automatic configuration script
  intune_logs:             true   # Intune Management Extension's logs: scripts and applications the tenant pushed and ran, their outcome
  jump_lists:              true   # jump lists: files and places each user opened, per application
  known_networks:          true   # networks the machine joined: name, kind, gateway, first and last connection (NetworkList)
  local_groups:            true   # members of each local group (SAM)
  log_file:                true   # $LogFile and $TxfLog: NTFS and transactional NTFS journals, raw copy only
  mft:                     true   # $MFT: every file, present or deleted, with its dates (mft.json)
  mounted_devices:         true   # volumes and drive letters the machine knew (MountedDevices)
  mount_points:            true   # volumes and network shares each user's Explorer saw, with their commands (MountPoints2)
  mru:                     true   # files each user opened or saved through the common dialogs
  mru_apps:                true   # programs used to open or save those files
  muicache:                true   # names of the programs each user launched
  network:                 true   # live: connections, neighbours, interfaces, routes
  network_configuration:   true   # network adapters and their last IPv4/IPv6 settings and DHCP leases, read offline
  network_shares:          true   # folders the machine shares, with their path and permissions (LanmanServer)
  ntfs_volumes:            true   # $Boot and $UsnJrnl:$Max: volume serial and geometry, creation of the change journal
  office_trust_records:    true   # Office trusted documents: macros enabled by the user, and when
  onedrive:                true   # OneDrive's logs (.odl) and settings of each profile, its sync database included, raw copy only
  operating_system:        true   # version, installation, computer name, uptime
  persistence:             true   # registry persistence beyond Run: IFEO, AppInit_DLLs, Winlogon, LSA packages, COM hijacking…
  powershell_history:      true   # PSReadLine: the commands typed in PowerShell, per profile
  powershell_profiles:     true   # PowerShell profiles of the machine and of each user: scripts run at every start, a persistence
  prefetch:                true   # Prefetch: programs run, count, last eight runs, files loaded
  processes:               true   # live
  program_usage:           true   # programs each user launched or used: FeatureUsage, JumplistData, compatibility store and layers, RADAR, pinned items
  rdp_client:              true   # outgoing RDP connections: servers reached, .rdp files, bitmap cache tiles
  rdp_server:              true   # incoming RDP connections: authentications, sessions, sources (event logs)
  recent_documents:        true   # Recent: shortcuts to the files each user opened
  recycle_bin:             true   # $I of every volume's recycle bin: what was deleted, by whom, when
  registry_backups:        true   # RegBack: the machine's older hives, raw copy only
  root_certificates:       true   # root certificates of the machine and of each user
  run_keys:                true   # Run and RunOnce keys of the machine and of each user
  scheduled_tasks:         true   # scheduled tasks: commands, triggers, authors, dates
  search_index:            true   # Windows Search index: path, dates, size, owner, summary of each indexed item, deleted ones included
  security:                true   # SECURITY hive: LSA secrets' names and dates, cached logons, audit policy (never a secret)
  security_descriptors:    true   # $Secure:$SDS: owner and access rights of every file, each descriptor once (mft.json: SecurityId)
  services:                true   # services and drivers
  sessions:                true   # live
  setupapi:                true   # setupapi.dev.log: device installations, first connection of a USB key
  shadow_copies:           true   # shadow copies, read raw without the VSS service: hives and event logs as each copy kept them
  shellbags:               true   # folders each user browsed in Explorer
  shimcache:               true   # application compatibility cache (AppCompatCache)
  shortcuts:               true   # shortcuts outside Recent: Start menu, desktops, Quick Launch, pinned task bar
  srum:                    true   # SRUDB.dat: bytes sent and received, resources used, per application and user, 30 to 60 days
  startup_folders:         true   # startup folders: what runs at logon
  sysmon:                  true   # Sysmon where it runs: its configuration (rules as stored) and the deleted files it archived; its log is in events
  thumbcache:              true   # Explorer's thumbnail and icon caches: what each user saw, even deleted since; images exported
  typed_paths:             true   # paths typed in Explorer's address bar
  usbstor:                 true   # USB mass storage devices (Enum\USBSTOR)
  userassist:              true   # programs each user launched from Explorer, with count and date
  users:                   true   # local accounts (SAM): logons, failures, flags, password hashes
  user_shell_folders:      true   # where each user's desktop, documents, downloads really are (OneDrive, another disk, a share)
  usn_journal:             true   # $UsnJrnl:$J: creations, renames, deletions (usn_journal.json)
  web_client:              true   # browsers: visits, downloads, searches (Edge, Chrome, Brave, Vivaldi, Opera); their databases copied raw
  web_server:                     # IIS, Apache, nginx: sites, modules, logs; connection strings, the applications' accounts;
                                  # database engines' data folders; each site's folder copied whole
    enabled:               true   # false: nothing read
    max_database_mib:      1024   # a database outside the sites, an engine's data folder, larger: said, not copied; unlimited: no bound
  wmi:                     true   # WMI repository: event subscriptions (filters, consumers, bindings), read offline
  word_wheel_query:        true   # terms searched in Explorer
  zone_identifiers:        true   # Zone.Identifier streams (Mark of the Web): where downloaded files came from
